<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주간 학원 시간표</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="app-container">
        <header class="main-header">
            <h1>My Weekly Schedule</h1>
        </header>

        <div class="timetable-wrapper" id="timetableWrapper">
            <div class="sticky-corner"></div>

            <div class="days-header">
                <div class="day-label">월</div>
                <div class="day-label">화</div>
                <div class="day-label">수</div>
                <div class="day-label">목</div>
                <div class="day-label">금</div>
            </div>

            <div class="time-sidebar">
                <!-- Times will be generated by JS -->
            </div>
            <div class="grid-container" id="gridContainer">
                <!-- Grid lines and Events will be here -->
            </div>
        </div>

        <button class="fab" id="addBtn" aria-label="Add Class">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </button>
    </div>

    <!-- Modal for adding events -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <h2>새로운 일정 추가</h2>
            <div class="form-group">
                <label for="eventName">학원/일정 이름</label>
                <input type="text" id="eventName" placeholder="예: 수학 학원" autocomplete="off">
            </div>

            <div class="form-group">
                <label>요일</label>
                <div class="day-selector" id="daySelector">
                    <button type="button" data-day="0" class="day-btn selected">월</button>
                    <button type="button" data-day="1" class="day-btn">화</button>
                    <button type="button" data-day="2" class="day-btn">수</button>
                    <button type="button" data-day="3" class="day-btn">목</button>
                    <button type="button" data-day="4" class="day-btn">금</button>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="startTime">시작 시간</label>
                    <input type="time" id="startTime" value="14:00" step="1800"> <!-- 30 min step -->
                </div>
                <div class="form-group">
                    <label for="duration">소요 시간 (분)</label>
                    <input type="number" id="duration" value="60" step="10" min="10">
                </div>
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" id="cancelBtn">취소</button>
                <button class="btn-save" id="saveBtn">추가하기</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
